<div class="h-screen w-screen grid grid-rows-[auto_1fr]">
  <header class="bg-gray-700 text-white p-3 flex items-center justify-between">
    <h1 class="text-xl">Notes</h1>

    <div class="flex gap-2 items-center">
      <app-button
        variant="primary"
        size="md"
        (clicked)="collapsed = !collapsed"
        >{{ collapsed ? '>' : '<' }}</app-button
      >
      <app-button
        variant="primary"
        size="md"
        [iconSvg]="checkIcon"
        iconPosition="left">
        Settings</app-button
      >
    </div>
  </header>

  <div class="grid grid-cols-[auto_1fr] overflow-hidden">
    <aside
      [ngClass]="{ 'w-96': !collapsed, 'w-0': collapsed }"
      class="bg-gray-700 text-white transition-all duration-300 overflow-auto">
      <div *ngIf="!collapsed" class="px-3">
        <app-sidebar></app-sidebar>
      </div>
    </aside>

    <main class="grid grid-cols-1 md:grid-cols-2 overflow-none">
      <div class="bg-blue-100 rounded shadow"></div>
      <div class="bg-gray-700 rounded shadow"></div>
    </main>
  </div>
</div>
