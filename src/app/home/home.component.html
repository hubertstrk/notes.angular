<div class="h-screen w-screen grid grid-rows-[auto_1fr]">
  <header
    class="bg-white text-black p-2 flex items-center justify-between shadow-md">
    <h1 class="ml-6 text-2xl text-black">Notes</h1>
    <div class="flex items-center gap-2">
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="collapsed ? chevronRight : chevronLeft"
        (clicked)="collapsed = !collapsed">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="plus"
        (clicked)="addNoteClicked()">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="settingsIcon"
        (clicked)="goToSettings()">
      </app-button>
    </div>
  </header>

  <div class="grid grid-cols-[auto_1fr] h-full overflow-hidden">
    <aside
      [ngClass]="{ 'w-80': !collapsed, 'w-0': collapsed }"
      class="bg-white text-black transition-all duration-300 overflow-auto shadow-lg">
      <div *ngIf="!collapsed" class="p-4">
        <app-sidebar></app-sidebar>
      </div>
    </aside>

    <main class="flex flex-col md:flex-row h-full">
      <div class="bg-gray-100 w-full md:w-1/2 h-full pb-6 pr-4">
        <app-editor></app-editor>
      </div>

      <div class="bg-white w-full md:w-1/2 h-full">
        <app-preview
          style="height: 96%"
          class="w-full block text-black pb-6 pr-2"></app-preview>
      </div>
    </main>
  </div>

  <app-footer></app-footer>
</div>
