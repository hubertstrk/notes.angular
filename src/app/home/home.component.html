<div class="relative h-screen w-screen grid grid-rows-[auto_1fr_auto]">
  <header
    data-tauri-drag-region
    class="titlebar bg-white dark:bg-zinc-800 text-black dark:text-white py-4 px-2 flex items-center justify-between">
    <div class="uppercase ml-4 text-2xl text-black dark:text-white">Notes</div>
    <div class="action-buttons flex items-center gap-2">
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="collapsed ? chevronRight : chevronLeft"
        (clicked)="collapsed = !collapsed">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="isDarkMode ? sunIcon : moonIcon"
        (clicked)="toggleDarkMode()">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="search"
        (clicked)="showSearch = !showSearch">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="plus"
        (clicked)="addNoteClicked()">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="settings"
        (clicked)="goToSettings()">
      </app-button>
    </div>
    <div class="flex items-center gap-2">
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="minimizeIcon"
        (clicked)="minimizeWindow()">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="maximizeIcon"
        (clicked)="maximizeWindow()">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="closeIcon"
        (clicked)="closeWindow()">
      </app-button>
    </div>
  </header>

  <div
    class="grid grid-cols-[auto_1fr] h-full overflow-hidden bg-white dark:bg-zinc-800">
    <aside
      [ngClass]="{ 'w-80': !collapsed, 'w-0': collapsed }"
      class="transition-all duration-300 overflow-auto">
      <div *ngIf="!collapsed" class="ml-4 mr-4">
        <app-sidebar></app-sidebar>
      </div>
    </aside>

    <main class="flex flex-col md:flex-row h-full">
      <div class="w-full md:w-1/2 h-full">
        <app-editor></app-editor>
      </div>

      <div class="bg-white dark:bg-zinc-800 w-full md:w-1/2 h-full">
        <app-preview class="flex w-full h-full"></app-preview>
      </div>
    </main>
  </div>

  <div class="flex w-full">
    <app-footer class="w-full"></app-footer>
  </div>

  <div
    *ngIf="showSearch"
    class="w-4/5 md:w-1/2 lg:w-1/3 fixed top-6 bg-white/50 dark:bg-zinc-800/50 backdrop-blur-sm left-1/2 -translate-x-1/2 flex justify-center z-[9999] shadow-xl rounded-lg">
    <app-search
      class="w-full"
      (noteClicked)="onNoteClicked($event)"
      (closeClicked)="showSearch = false"></app-search>
  </div>

  <div
    *ngIf="showTemplatePopup"
    class="w-4/5 md:w-1/2 lg:w-1/3 fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-white/50 dark:bg-zinc-800/50 backdrop-blur-sm flex justify-center z-[9999] shadow-xl rounded-lg">
    <app-note-template-popup
      (templateSelected)="onTemplateSelected($event)"
      (closed)="onTemplatePopupClosed()">
    </app-note-template-popup>
  </div>
</div>
