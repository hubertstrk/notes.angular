<div class="h-screen w-screen grid grid-rows-[auto_1fr]">
  <header class="bg-gray-800 text-white p-3 flex items-center justify-between">
    <h1 class="text-xl">Notes</h1>

    <div class="flex gap-2 items-center">
      <app-button
        variant="primary"
        size="md"
        (clicked)="collapsed = !collapsed"
        >{{ collapsed ? '>' : '<' }}</app-button
      >
      <app-button
        variant="primary"
        size="md"
        [iconSvg]="checkIcon"
        iconPosition="left">
        Settings</app-button
      >
    </div>
  </header>

  <div class="grid grid-cols-[auto_1fr] h-full overflow-hidden">
    <aside
      [ngClass]="{ 'w-96': !collapsed, 'w-0': collapsed }"
      class="bg-gray-800 text-white transition-all duration-300 overflow-auto">
      <div *ngIf="!collapsed" class="px-3">
        <app-sidebar (noteSelected)="noteSelected($event)"></app-sidebar>
      </div>
    </aside>

    <main class="flex flex-col md:flex-row h-full overflow-auto">
      <div class="bg-blue-100 w-full md:w-1/2"></div>

      <!-- Make this the scrollable container -->
      <div class="bg-gray-800 w-full md:w-1/2 overflow-auto">
        <app-preview
          [note]="selectedNote"
          class="h-full w-full block"></app-preview>
      </div>
    </main>
  </div>
</div>
