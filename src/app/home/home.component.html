<div class="home">
  <div id="header">
    <app-header></app-header>
  </div>
  <div id="sidebar">
    <app-sidebar></app-sidebar>
  </div>
  <div id="editor">
    <app-editor
      (textChanged)="onTextChanged($event)"
      [text]="editorChange.text"></app-editor>
  </div>
  <div id="preview">
    <app-preview [editorChange]="editorChange"></app-preview>
  </div>
</div>
