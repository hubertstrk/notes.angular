<div class="flex flex-end justify-end p-2">
  <app-button
    [size]="'sm'"
    [icon]="icons['material-symbols--close-small-outline-rounded']"
    (clicked)="close()">
  </app-button>
</div>

<div
  class="flex flex-col w-full px-4 justify-center items-center mb-4"
  (click)="$event.stopPropagation()">
  <h2 class="text-xl font-bold mb-4 text-black dark:text-white">
    Choose a Template
  </h2>
  <div class="flex flex-col gap-2 w-full">
    <button
      *ngFor="let template of templates"
      class="w-full text-left p-3 rounded-lg border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-400 dark:hover:bg-zinc-400 hover:bg-opacity-20 dark:hover:bg-opacity-20 hover:backdrop-filter hover:backdrop-blur-sm transition"
      (click)="selectTemplate(template)">
      <div class="flex items-center gap-2">
        <div>
          {{ template.icon }}
        </div>
        <div class="font-semibold text-black dark:text-white">
          {{ template.title }}
        </div>
      </div>
      <div class="text-md text-zinc-500">
        {{ template.description }}
      </div>
    </button>
  </div>
</div>
