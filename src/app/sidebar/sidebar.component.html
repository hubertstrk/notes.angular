<div *ngFor="let note of notes" class="mb-2">
  <div
    class="bg-white text-black p-4 rounded-md shadow-sm hover:shadow-md transition-shadow duration-200 cursor-pointer"
    [ngClass]="{
      'bg-gray-200 shadow-md': activeNote?.path === note.path
    }"
    (click)="onNoteClick(note)">
    <div class="leading-snug tracking-tight">
      {{ extractHeading(note) }}
    </div>
  </div>
</div>
