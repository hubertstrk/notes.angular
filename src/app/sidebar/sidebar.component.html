<div *ngFor="let note of notes$ | async" class="mb-2">
  <div
    (click)="onNoteClick(note)"
    class="bg-gradient-to-r from-gray-700 to-gray-900 text-white p-2 rounded-lg cursor-pointer hover:from-gray-600 hover:to-gray-800 transition-all duration-300 shadow-md">
    <div class="text-lg font-semibold tracking-wide">
      {{ extractHeading(note) }}
    </div>
    <div class="text-sm text-gray-400">
      {{ note.path }}
    </div>
  </div>
</div>
