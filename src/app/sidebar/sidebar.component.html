<div *ngFor="let note of notes" class="mb-2">
  <div
    class="cursor-pointer p-2 rounded-md hover:bg-gray-100 transition-all duration-150 text-sm text-black"
    [class.bg-gray-100]="activeNote?.path === note.path"
    (click)="onNoteClick(note)">
    <div class="">
      {{ note.heading }}
    </div>
  </div>
</div>
