<div *ngFor="let note of notes" class="mb-2 text-black dark:text-white">
  <div
    class="cursor-pointer p-2 rounded-md transition-all duration-150 text-sm hover:bg-zinc-100 dark:hover:bg-zinc-700"
    [class.bg-gray-100]="activeNote?.path === note.path"
    [class.dark:bg-gray-700]="activeNote?.path === note.path"
    (click)="onNoteClick(note)">
    <div class="">
      {{ note.heading }}
    </div>
  </div>
</div>
