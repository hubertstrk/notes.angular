<div *ngFor="let note of notes" class="mb-2">
  <div
    class="bg-gradient-to-r text-white p-2 rounded-lg cursor-pointer hover:from-gray-500 hover:to-gray-800 transition-all duration-300 shadow-md"
    [ngClass]="{
      'from-gray-500 to-gray-800': activeNote?.path === note.path,
      'from-gray-700 to-gray-900': activeNote?.path !== note.path
    }"
    (click)="onNoteClick(note)">
    <div class="text-lg font-semibold tracking-wide">
      {{ extractHeading(note) }}
    </div>
    <div class="text-sm text-gray-400">
      {{ note.path }}
    </div>
  </div>
</div>
