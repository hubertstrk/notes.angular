<div
  class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-0 backdrop-blur-sm z-[9999] flex justify-center items-center"
  *ngIf="isVisible">
  <div
    class="flex flex-col items-center justify-center px-10 py-8 bg-white dark:bg-zinc-700 rounded-lg shadow-lg w-80">
    <div class="text-lg text-zinc-800 dark:text-zinc-100 mb-3">
      {{ message }}
    </div>
    <app-progress-bar
      [progress]="progress"
      [showPercentage]="true"
      class="w-full"></app-progress-bar>
  </div>
</div>
