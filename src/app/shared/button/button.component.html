<button
  [ngClass]="computedClasses"
  class="flex items-center justify-center"
  [disabled]="disabled"
  (click)="onClick($event)">
  <span
    *ngIf="sanitizedIconSvg && iconPosition === 'left'"
    class="flex mr-2"
    [innerHTML]="sanitizedIconSvg"></span>
  <ng-content></ng-content>
  <span
    *ngIf="sanitizedIconSvg && iconPosition === 'right'"
    class="flex"
    [innerHTML]="sanitizedIconSvg"></span>
</button>
