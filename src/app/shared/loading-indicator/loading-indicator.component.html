<div
  class="fixed top-0 left-0 w-full h-full bg-black bg-opacity-0 backdrop-blur-sm z-[9999] flex justify-center items-center"
  *ngIf="isVisible">
  <div
    class="flex flex-col items-center justify-center px-10 py-8 bg-zinc-700 rounded-lg shadow-lg">
    <div class="text-white mb-3">{{ text }}</div>
    <div
      class="flex justify-center items-center text-white"
      [innerHTML]="loadingIcon"></div>
  </div>
</div>
