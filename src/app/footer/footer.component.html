<footer
  class="text-sm w-full p-2 flex justify-between items-center text-neutral-300">
  <div class="flex items-center gap-4">
    <span>Created: {{ activeNote?.createdAt | date: 'medium' || '' }}</span>
    <span>Modified: {{ activeNote?.updatedAt | date: 'medium' || '' }}</span>
  </div>
  <div
    *ngIf="activeNote && cursorPosition"
    class="flex items-center justify-center gap-4">
    <div>Characters {{ activeNote.content.length || '' }}</div>
    <div>Line {{ cursorPosition.line }}</div>
    <div>Column {{ cursorPosition.column }}</div>
  </div>
</footer>
