<footer
  class="bg-zinc-800 text-white text-sm w-full p-2 flex justify-between items-center">
  <span>Path: {{ (activeNote$ | async)?.path || 'No active note' }}</span>
  <div class="flex items-center gap-4">
    <span>Characters: {{ (activeNote$ | async)?.content?.length || 0 }}</span>
    <span>Line: {{ (cursorPosition$ | async)?.line || 0 }}</span>
    <span>Column: {{ (cursorPosition$ | async)?.column || 0 }}</span>
  </div>
</footer>
