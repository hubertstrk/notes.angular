<div #editorContainer class="editor h-full w-full flex flex-col">
  <ngx-monaco-editor
    class="flex-1 h-full w-full"
    [options]="editorOptions"
    [ngModel]="(activeNote$ | async)?.content"
    (ngModelChange)="onTextChange($event)"
    (onInit)="onEditorInit($event)">
  </ngx-monaco-editor>
</div>
