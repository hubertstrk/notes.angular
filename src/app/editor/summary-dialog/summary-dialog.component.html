@if (isOpen) {
  <div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-zinc-800 rounded-lg shadow-xl w-[90vw] md:w-[60vw] max-w-[90vw] md:max-w-[60vw] max-h-[90vh] flex flex-col mx-4">
      <!-- Header -->
      <div class="px-6 py-4 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
        <h2 class="text-xl font-bold text-gray-900 dark:text-white">AI Result</h2>
        <button
          (click)="onCancel()"
          class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-2xl leading-none">
          ✕
        </button>
      </div>

      <!-- Content with scroll -->
      <div class="flex-1 overflow-y-auto px-6 py-4">
        <div
          class="prose prose-zinc dark:prose-invert max-w-none"
          [innerHTML]="summaryHtml">
        </div>
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-3">
        <app-button
          (clicked)="onCancel()"
          [rounded]="false"
          [variant]="'transparent'">
          Cancel
        </app-button>
        <app-button
          (clicked)="onAccept()"
          [rounded]="false"
          [variant]="'primary'">
          Accept & Update Note
        </app-button>
      </div>
    </div>
  </div>
}
