<div class="flex flex-col h-full w-full">
  <div class="flex justify-between mx-3">
    <div class="flex">
      <app-button
        [icon]="icons['fluent--zoom-in-24-regular']"
        (clicked)="updateFontSize(0.2)">
      </app-button>
      <app-button
        [icon]="icons['fluent--zoom-out-24-regular']"
        (clicked)="updateFontSize(-0.2)">
      </app-button>
    </div>
    <div class="flex">
      <app-button
        [icon]="icons['fluent--print-24-regular']"
        (clicked)="print()"></app-button>
      <app-button
        [icon]="icons['fluent--delete-24-regular']"
        (clicked)="deleteNote()"></app-button>
    </div>
  </div>

  <iframe
    #previewIframe
    src="assets/preview.html"
    style="width: 100%; height: 100%; border: none">
  </iframe>
</div>
