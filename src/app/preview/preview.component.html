<div class="h-full overflow-auto p-4">
  <div class="flex justify-between">
    <div class="flex">
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="zoomInIcon"
        (clicked)="increaseFontSize()">
      </app-button>
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="zoomOutIcon"
        (clicked)="decreaseFontSize()">
      </app-button>
    </div>
    <div class="flex">
      <app-button
        variant="transparent"
        [rounded]="true"
        [iconSvg]="deleteNoteIcon"
        (clicked)="decreaseFontSize()">
      </app-button>
    </div>
  </div>

  <iframe
    #previewIframe
    src="assets/preview.html"
    style="width: 100%; height: 100%; border: none"></iframe>
</div>
