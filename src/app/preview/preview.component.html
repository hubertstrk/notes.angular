<div class="flex flex-col h-full w-full">
  <div class="flex justify-between mx-3">
    <div class="flex">
      <app-button
        (clicked)="updateFontSize(0.2)"
        [icon]="icons['fluent--zoom-in-24-regular']">
      </app-button>
      <app-button
        (clicked)="updateFontSize(-0.2)"
        [icon]="icons['fluent--zoom-out-24-regular']">
      </app-button>
    </div>
    <div class="flex">
      <app-button
        (clicked)="restoreNote()"
        [icon]="icons['material-symbols-light--recycling']"></app-button>
      <app-button
        (clicked)="print()"
        [icon]="icons['fluent--print-24-regular']"></app-button>
      <app-button
        (clicked)="deleteNote()"
        [icon]="icons['fluent--delete-24-regular']"></app-button>
    </div>
  </div>

  <iframe
    #previewIframe
    src="assets/preview.html"
    style="width: 100%; height: 100%; border: none">
  </iframe>
</div>
