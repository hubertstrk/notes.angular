<div class="flex flex-end justify-end p-2">
  <app-button
    variant="transparent"
    [size]="'sm'"
    [rounded]="true"
    [iconSvg]="cancelIcon"
    (clicked)="close()">
  </app-button>
</div>
<div class="w-full px-4 flex justify-center items-center">
  <input
    type="text"
    placeholder="Search notes..."
    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-400 shadow-sm text-lg transition-all duration-200 bg-white"
    (input)="onSearchInput($event)"
    autofocus />
</div>
<div class="w-full p-4 flex justify-center items-center">
  <div *ngIf="searchResults.length === 0" class="text-gray-500">
    No results found
  </div>
  <div *ngIf="searchResults.length > 0" class="w-full">
    <div
      *ngFor="let result of searchResults"
      class="p-2 cursor-pointer hover:bg-gray-100 transition duration-200"
      (click)="openNote(result.item)">
      <h2 class="text-lg font-semibold text-gray-800">
        {{ result.item.heading }}
      </h2>
      <p class="text-gray-600 text-sm">
        <span [innerHTML]="result.preview"></span>
      </p>
    </div>
  </div>
</div>
