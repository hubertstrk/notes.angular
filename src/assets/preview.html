<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@10.3.2/build/styles/a11y-dark.min.css" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <title>Markdown Preview</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 1em;
      }
    </style>
  </head>
  <body>
    <div id="content"></div>

    <script>
      window.addEventListener(
        'message',
        event => {
          if (event.data.type === 'html') {
            const content = document.getElementById('content');
            content.innerHTML = event.data.html;

            const tables = content.querySelectorAll('table');
            tables.forEach(table => {
              table.classList.add('table', 'table-bordered');
            });

            hljs.highlightAll();
          }

          if (event.data.type === 'font-size') {
            document.documentElement.style.fontSize = `${event.data.value}rem`;
          }
        },
        false
      );
    </script>
  </body>
</html>
